name: Build Netfarjo Android App

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set Android SDK Environment
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Install Frontend Dependencies
        run: |
          npm --prefix frontend install

      - name: Build Web Application
        run: |
          npm --prefix frontend run build

      - name: Sync Capacitor Android
        run: |
          cd frontend
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Copy & Rename APK
        run: |
          mkdir -p output
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk output/Netfarjo-v1.0.apk
          ls -lh output/Netfarjo-v1.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Netfarjo-v1.0-APK
          path: output/Netfarjo-v1.0.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-apk
          name: 'Netfarjo Android App v1.0'
          body: |
            ## 📱 Netfarjo Android App v1.0
            
            - Fast, lightweight native cinema streaming experience.
            - Fullscreen landscape auto-rotation.
            - 5 streaming servers + Download Center.
            - VIP Activation Code: `netfarjo01`
            
            Download the APK file below and install it directly on your Android phone or tablet.
          files: output/Netfarjo-v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
