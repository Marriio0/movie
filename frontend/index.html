<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Netfarjo - نتفرجو: Discover and stream trending movies and series with full subtitle support and cinematic quality."
    />
    <meta name="theme-color" content="#0b0b0d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Netfarjo</title>
    <script>
      // Applies the saved theme or desktop/time auto theme before first paint.
      // Keep the storage key, default and colors in sync with src/shared/theme/theme-store.ts.
      (function () {
        var preference = 'system';
        try {
          var stored = localStorage.getItem('marquee:theme');
          if (stored === 'light' || stored === 'dark' || stored === 'system') preference = stored;
        } catch (e) {}
        var resolved;
        if (preference === 'light') {
          resolved = 'light';
        } else if (preference === 'dark') {
          resolved = 'dark';
        } else {
          var prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (prefersLight) {
            resolved = 'light';
          } else if (prefersDark) {
            resolved = 'dark';
          } else {
            var hour = new Date().getHours();
            resolved = (hour >= 7 && hour < 19) ? 'light' : 'dark';
          }
        }
        document.documentElement.dataset.theme = resolved;
        var themeColor = resolved === 'light' ? '#f8fafc' : '#0b0b0d';
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', themeColor);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
          for (var reg of registrations) reg.unregister();
        });
        if (window.caches) {
          caches.keys().then(function (names) {
            for (var name of names) caches.delete(name);
          });
        }
      }
    </script>
  </body>
</html>
